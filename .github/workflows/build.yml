name: Build PojavLauncher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PojavLauncher
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          ref: v3_openjdk
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Get LTW
        run: |
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      # Сборки JRE в android-openjdk-build-multiarch удалены по сроку хранения (проект заброшен),
      # поэтому берём готовые JRE из последнего официального APK PojavLauncher.
      - name: Get JREs from the latest official release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel && cd /tmp/rel
          gh release download --repo PojavLauncherTeam/PojavLauncher --pattern "*.apk"
          ls -la
          APK=$(ls -S *.apk | head -1)
          echo "Берём JRE из $APK"
          unzip -q -o "$APK" "assets/components/*" -d extracted
          ls -la extracted/assets/components
          cd "$GITHUB_WORKSPACE"
          for c in jre jre-new jre-21; do
            if [ -d "/tmp/rel/extracted/assets/components/$c" ]; then
              rm -rf "app_pojavlauncher/src/main/assets/components/$c"
              cp -r "/tmp/rel/extracted/assets/components/$c" "app_pojavlauncher/src/main/assets/components/$c"
              echo "OK: $c"; ls "app_pojavlauncher/src/main/assets/components/$c"
            else
              echo "::warning::В официальном APK нет компонента $c"
            fi
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug --no-daemon
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/PojavLauncher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-debug
          path: out/PojavLauncher-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PojavLauncher (сборка ${{ github.run_number }})
          body: Debug-сборка PojavLauncher из PojavLauncherTeam/PojavLauncher (ветка v3_openjdk) со встроенными JRE из официального релиза.
          files: out/PojavLauncher-debug.apk
          make_latest: true
